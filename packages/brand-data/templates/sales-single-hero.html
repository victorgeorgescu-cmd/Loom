<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{preheader}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Client reset — minimal, non-structural. */
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse !important; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { text-decoration: none; }

    /* Dark mode — keep honey-gold accents (they read on both, per fha/style.md). */
    @media (prefers-color-scheme: dark) {
      .loom-bg { background-color: #1c1c1c !important; }
      .loom-container { background-color: #242424 !important; }
      .loom-headline { color: #f4f4f0 !important; }
      .loom-body { color: #e8e8e8 !important; }
      .loom-footer { color: #b8b8b8 !important; }
    }

    @media only screen and (max-width: 600px) {
      .loom-container { width: 100% !important; }
      .loom-h1 { font-size: 26px !important; }
      .loom-pad { padding-left: 22px !important; padding-right: 22px !important; }
    }
  </style>
</head>
<body class="loom-bg" style="margin:0; padding:0; background-color:#f4f4f0;">
  <!-- Preheader (hidden) -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;" data-slot="preheader">{{preheader}}</div>

  <!-- ░░ LOCKED SCAFFOLD ░░ outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="loom-bg" data-locked="true" style="background-color:#f4f4f0;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <!--[if mso]>
        <table role="presentation" align="center" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="loom-container" data-locked="true" style="width:600px; max-width:600px; background-color:#ffffff;">

          <!-- Header -->
          <tr><td class="loom-pad" style="padding:24px 32px 8px 32px;" align="center">
            <span class="loom-headline" data-slot="brand_name" style="font-family:Georgia,'Times New Roman',serif; font-size:18px; color:#4a2c1a; letter-spacing:0.5px;">{{brand_name}}</span>
          </td></tr>

          <!-- Hero image -->
          <tr><td data-locked="true" style="padding:16px 0 0 0;" align="center">
            <img data-slot="hero_image" src="{{hero_image_url}}" width="600" height="400" alt="{{hero_image_alt}}" style="display:block; width:100%; max-width:600px; height:auto;" />
          </td></tr>

          <!-- Body — story-led single column -->
          <tr><td class="loom-pad" style="padding:28px 32px 8px 32px;">
            <h1 class="loom-headline loom-h1" data-slot="headline" style="margin:0 0 16px 0; font-family:Georgia,'Times New Roman',serif; font-size:32px; line-height:1.25; color:#4a2c1a;">{{headline}}</h1>
            <div class="loom-body" data-slot="body" style="font-family:Arial,Helvetica,sans-serif; font-size:17px; line-height:1.5; color:#3a3a3a;">{{body}}</div>
          </td></tr>

          <!-- Testimonial -->
          <tr><td class="loom-pad" style="padding:8px 32px 8px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" data-locked="true">
              <tr><td style="border-left:3px solid #c9a227; padding:8px 0 8px 16px;">
                <em class="loom-body" data-slot="testimonial" style="font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.5; color:#6b6b3a;">{{testimonial}}</em>
              </td></tr>
            </table>
          </td></tr>

          <!-- CTA — full width, with MSO VML button fallback -->
          <tr><td class="loom-pad" style="padding:24px 32px 32px 32px;" align="center">
            <!--[if mso]>
            <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{cta_url}}" style="height:50px;v-text-anchor:middle;width:280px;" arcsize="8%" fillcolor="#4a2c1a" stroke="f">
            <w:anchorlock/>
            <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:17px;">{{cta_text}}</center>
            </v:roundrect>
            <![endif]-->
            <!--[if !mso]><!-- -->
            <a data-slot="cta" href="{{cta_url}}" style="background-color:#4a2c1a; color:#ffffff; display:inline-block; font-family:Arial,Helvetica,sans-serif; font-size:17px; font-weight:bold; line-height:50px; text-align:center; text-decoration:none; width:280px; border-radius:4px;">{{cta_text}}</a>
            <!--<![endif]-->
          </td></tr>

          <!-- Footer — CAN-SPAM + AC merge tags. data-locked scaffold, slotted address. -->
          <tr><td class="loom-pad loom-footer" data-locked="true" style="padding:24px 32px 32px 32px; border-top:1px solid #e6e6e0; font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:1.5; color:#8a8a8a;" align="center">
            <span data-slot="footer_address">{{footer_address}}</span><br />
            <a href="%UNSUBSCRIBELINK%" style="color:#8a8a8a; text-decoration:underline;">Unsubscribe</a>
            &nbsp;|&nbsp;
            <a href="%FORWARD2FRIEND%" style="color:#8a8a8a; text-decoration:underline;">Forward to a friend</a>
          </td></tr>

        </table>
        <!--[if mso]>
        </td></tr></table>
        <![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
